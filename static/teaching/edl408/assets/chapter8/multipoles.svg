<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc">
  <title id="title">Fyrstu fjórir fjölpólarnir</title>
  <desc id="desc">Einpóll, tvípóll, fjórpóll á ferningi og áttpóll á teningi.</desc>
  <rect x="1" y="1" width="1038" height="378" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(125 0)">
      <text y="42" font-size="20" font-weight="700" fill="#0f172a">Einpóll (monopole)</text>
      <text y="70" font-size="16" fill="#475569">ℓ = 0</text>
      <circle cy="190" r="34" fill="#fee2e2" stroke="#be123c" stroke-width="3"/><text y="199" font-size="30" font-weight="700" fill="#be123c">+</text>
      <text y="315" font-size="18" fill="#334155">V ∝ 1/r</text>
    </g>
    <g transform="translate(380 0)">
      <text y="42" font-size="20" font-weight="700" fill="#0f172a">Tvípóll (dipole)</text>
      <text y="70" font-size="16" fill="#475569">ℓ = 1</text>
      <line x1="-48" y1="190" x2="48" y2="190" stroke="#64748b" stroke-width="4"/>
      <circle cx="-48" cy="190" r="30" fill="#fee2e2" stroke="#be123c" stroke-width="3"/><circle cx="48" cy="190" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="-48" y="199" font-size="27" font-weight="700" fill="#be123c">+</text><text x="48" y="199" font-size="27" font-weight="700" fill="#2563eb">−</text>
      <text y="315" font-size="18" fill="#334155">V ∝ 1/r²</text>
    </g>
    <g transform="translate(650 0)">
      <text y="42" font-size="20" font-weight="700" fill="#0f172a">Fjórpóll (quadrupole)</text>
      <text y="70" font-size="16" fill="#475569">ℓ = 2</text>
      <g transform="translate(0 190)" font-size="22" font-weight="700">
        <path d="M-62-62 H62 V62 H-62 Z" fill="none" stroke="#64748b" stroke-width="4"/>
        <circle cx="-62" cy="-62" r="23" fill="#fee2e2" stroke="#be123c" stroke-width="3"/><text x="-62" y="-54" fill="#be123c">+</text>
        <circle cx="62" cy="-62" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="62" y="-54" fill="#2563eb">−</text>
        <circle cx="-62" cy="62" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="-62" y="70" fill="#2563eb">−</text>
        <circle cx="62" cy="62" r="23" fill="#fee2e2" stroke="#be123c" stroke-width="3"/><text x="62" y="70" fill="#be123c">+</text>
      </g>
      <text y="315" font-size="18" fill="#334155">V ∝ 1/r³</text>
    </g>
    <g transform="translate(910 0)">
      <text y="42" font-size="20" font-weight="700" fill="#0f172a">Áttpóll (octupole)</text>
      <text y="70" font-size="16" fill="#475569">ℓ = 3</text>
      <g transform="translate(0 194)" font-size="18" font-weight="700">
        <path d="M-66-38 H34 V62 H-66 Z M-30-72 H70 V28 H-30 Z M-66-38 L-30-72 M34-38 L70-72 M34 62 L70 28 M-66 62 L-30 28" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="-66" cy="-38" r="18" fill="#fee2e2" stroke="#be123c" stroke-width="2"/><text x="-66" y="-32" fill="#be123c">+</text>
        <circle cx="34" cy="-38" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="34" y="-32" fill="#2563eb">−</text>
        <circle cx="-66" cy="62" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="-66" y="68" fill="#2563eb">−</text>
        <circle cx="34" cy="62" r="18" fill="#fee2e2" stroke="#be123c" stroke-width="2"/><text x="34" y="68" fill="#be123c">+</text>
        <circle cx="-30" cy="-72" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="-30" y="-66" fill="#2563eb">−</text>
        <circle cx="70" cy="-72" r="18" fill="#fee2e2" stroke="#be123c" stroke-width="2"/><text x="70" y="-66" fill="#be123c">+</text>
        <circle cx="-30" cy="28" r="18" fill="#fee2e2" stroke="#be123c" stroke-width="2"/><text x="-30" y="34" fill="#be123c">+</text>
        <circle cx="70" cy="28" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="70" y="34" fill="#2563eb">−</text>
      </g>
      <text y="315" font-size="18" fill="#334155">V ∝ 1/r⁴</text>
    </g>
  </g>
</svg>
