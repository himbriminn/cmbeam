<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="t d">
 <title id="t">Sveifluhættir hringlaga trommuskinns</title><desc id="d">Fjórir hringlaga sveifluhættir með radíal- og hornhnútum.</desc>
 <rect x="1" y="1" width="898" height="698" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
 <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a">
  <text x="245" y="55" font-size="25" font-weight="700">m = 1, n = 0</text><text x="655" y="55" font-size="25" font-weight="700">m = 2, n = 0</text>
  <text x="245" y="365" font-size="25" font-weight="700">m = 1, n = 1</text><text x="655" y="365" font-size="25" font-weight="700">m = 2, n = 1</text>
 </g>
 <g fill="#f8fafc" stroke="#0f172a" stroke-width="4">
  <circle cx="245" cy="190" r="115"/><circle cx="655" cy="190" r="115"/><circle cx="655" cy="190" r="48"/>
  <circle cx="245" cy="505" r="115"/><line x1="245" y1="390" x2="245" y2="620"/>
  <circle cx="655" cy="505" r="115"/><circle cx="655" cy="505" r="48"/><line x1="655" y1="390" x2="655" y2="620"/>
 </g>
 <g font-family="system-ui,sans-serif" font-size="38" font-weight="700" text-anchor="middle">
  <text x="245" y="202" fill="#be123c">+</text>
  <text x="655" y="202" fill="#be123c">+</text><text x="750" y="202" fill="#2563eb">−</text>
  <text x="185" y="518" fill="#2563eb">−</text><text x="305" y="518" fill="#be123c">+</text>
  <text x="630" y="518" fill="#2563eb">−</text><text x="680" y="518" fill="#be123c">+</text><text x="550" y="518" fill="#be123c">+</text><text x="760" y="518" fill="#2563eb">−</text>
 </g>
 <g font-family="system-ui,sans-serif" font-size="20" fill="#475569" text-anchor="middle">
  <text x="245" y="330">grunntónn</text><text x="655" y="330">einn radíalhnútur</text>
  <text x="245" y="650">ein hornhnútalína</text><text x="655" y="650">radíal- og hornhnútur</text>
 </g>
</svg>
